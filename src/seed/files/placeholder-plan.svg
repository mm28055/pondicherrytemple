<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <title>Placeholder: a generic temple plan, standing in for Abishek P.'s drawing</title>

  <!-- The sheet -->
  <rect width="1200" height="1500" fill="#efe9dd"/>
  <rect x="30" y="30" width="1140" height="1440" fill="none" stroke="#d8d1c5" stroke-width="2"/>

  <!-- Title block -->
  <text x="120" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#a8321e">PLACEHOLDER</text>
  <text x="120" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#72675e">Abishek P.’s drawing of the temple will go here</text>

  <!-- Outer wall, in the red and white stripes of a temple wall -->
  <rect x="120" y="220" width="960" height="1180" fill="none" stroke="#f5f4f0" stroke-width="18"/>
  <rect x="120" y="220" width="960" height="1180" fill="none" stroke="#a8321e" stroke-width="18" stroke-dasharray="24 24"/>
  <g fill="none" stroke="#191512" stroke-width="1.5">
    <rect x="111" y="211" width="978" height="1198"/>
    <rect x="129" y="229" width="942" height="1162"/>
  </g>

  <!-- Gopuram, the gateway tower -->
  <rect x="510" y="1352" width="180" height="104" fill="#efe9dd" stroke="#191512" stroke-width="5"/>
  <path d="M575 1352 V1456 M625 1352 V1456" stroke="#191512" stroke-width="3"/>

  <!-- The path of circumambulation, clockwise -->
  <rect x="290" y="290" width="620" height="1050" rx="28" fill="none" stroke="#72675e" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g fill="none" stroke="#72675e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M278 820 L290 804 L302 820"/>
    <path d="M588 278 L604 290 L588 302"/>
    <path d="M898 790 L910 806 L922 790"/>
    <path d="M412 1328 L396 1340 L412 1352"/>
  </g>
  <text transform="translate(272 1000) rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#72675e" text-anchor="middle">PRADAKSHINA PATH</text>

  <!-- Inner wall, open at the front -->
  <path d="M570 1080 H330 V330 H870 V1080 H630" fill="none" stroke="#191512" stroke-width="7"/>

  <!-- Sanctum, ardha mandapam, maha mandapam -->
  <g fill="none" stroke="#191512">
    <rect x="510" y="470" width="180" height="180" stroke-width="9"/>
    <rect x="550" y="510" width="100" height="100" stroke-width="3"/>
    <rect x="505" y="650" width="190" height="140" stroke-width="4"/>
    <rect x="440" y="790" width="320" height="250" stroke-width="4"/>
  </g>
  <circle cx="600" cy="560" r="16" fill="#a8321e"/>
  <g fill="#191512">
    <circle cx="500" cy="835" r="7"/><circle cx="567" cy="835" r="7"/><circle cx="633" cy="835" r="7"/><circle cx="700" cy="835" r="7"/>
    <circle cx="500" cy="895" r="7"/><circle cx="567" cy="895" r="7"/><circle cx="633" cy="895" r="7"/><circle cx="700" cy="895" r="7"/>
    <circle cx="500" cy="955" r="7"/><circle cx="567" cy="955" r="7"/><circle cx="633" cy="955" r="7"/><circle cx="700" cy="955" r="7"/>
  </g>

  <!-- Two smaller shrines -->
  <g fill="none" stroke="#191512" stroke-width="5">
    <rect x="370" y="380" width="80" height="80"/>
    <rect x="750" y="380" width="80" height="80"/>
  </g>
  <g fill="#191512">
    <rect x="400" y="410" width="20" height="20"/>
    <rect x="780" y="410" width="20" height="20"/>
  </g>

  <!-- On the axis, from the inner gate to the gopuram -->
  <rect x="578" y="1112" width="44" height="44" fill="#efe9dd" stroke="#191512" stroke-width="4"/>
  <rect x="586" y="1201" width="28" height="28" fill="none" stroke="#191512" stroke-width="2"/>
  <circle cx="600" cy="1215" r="9" fill="#191512"/>
  <polygon points="600,1265 620,1285 600,1305 580,1285" fill="#efe9dd" stroke="#191512" stroke-width="3"/>

  <!-- The sacred tree, and the temple kitchen -->
  <g stroke="#463e38" stroke-width="3" fill="#e2dccb">
    <circle cx="190" cy="430" r="26"/>
    <circle cx="222" cy="422" r="24"/>
    <circle cx="208" cy="452" r="24"/>
  </g>
  <rect x="955" y="390" width="90" height="80" fill="#efe9dd" stroke="#191512" stroke-width="4"/>
  <rect x="975" y="410" width="50" height="40" fill="none" stroke="#191512" stroke-width="2"/>

  <!-- Labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" fill="#463e38" text-anchor="middle">
    <text x="600" y="456">GARBHAGRIHA</text>
    <text x="600" y="1016">MAHA MANDAPAM</text>
    <text x="410" y="492">SHRINE</text>
    <text x="790" y="492">SHRINE</text>
    <text x="205" y="506">STHALA</text>
    <text x="205" y="526">VRIKSHA</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#463e38" text-anchor="middle">
    <text x="600" y="725">ARDHA MANDAPAM</text>
    <text x="1000" y="500">MADAPPALLI</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" fill="#463e38">
    <text x="648" y="1140">VAHANA MANDAPAM</text>
    <text x="648" y="1221">DHVAJASTHAMBHAM</text>
    <text x="648" y="1291">BALIPEETHAM</text>
    <text x="706" y="1440">GOPURAM</text>
  </g>
</svg>
